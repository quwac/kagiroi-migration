name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  verify:
    needs: version
    uses: $/.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}

  central:
    needs: [version, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: Publish signed core library
        run: ./gradlew -Pversion="$RELEASE_VERSION" :migration-core:publishAndReleaseToMavenCentral --no-configuration-cache --console=plain
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
      - name: Wait for the plugin dependency on Maven Central
        run: |
          base="https://repo.maven.apache.org/maven2/dev/quwac/kagiroi"
          curl --fail --silent --show-error --retry 60 --retry-all-errors --retry-delay 10 \
            "$base/migration-core/$RELEASE_VERSION/migration-core-$RELEASE_VERSION.pom" -o /dev/null
          curl --fail --silent --show-error --retry 60 --retry-all-errors --retry-delay 10 \
            "$base/migration-core-jvm/$RELEASE_VERSION/migration-core-jvm-$RELEASE_VERSION.jar" -o /dev/null

  plugin:
    needs: [version, central]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: Publish Gradle plugin
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew -Pversion="$RELEASE_VERSION" :migration-gradle-plugin:publishPlugins --no-configuration-cache --console=plain

  release:
    needs: [version, plugin]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          merge-multiple: true
          path: distributions
      - name: Verify and publish CLI downloads
        working-directory: distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          cat ./*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release create "v$RELEASE_VERSION" ./*.tar.gz ./*.zip ./*.sha256 SHA256SUMS \
            --verify-tag --title "v$RELEASE_VERSION" --generate-notes
