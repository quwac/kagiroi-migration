name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: '2026.11.4'
          sha256: 0296d9cba9324106d4e0962bb94a2072902f3658813aeb3b09504947bb8ddc2b
          install_args: >-
            --locked java bun node hk rumdl pkl lychee gh zizmor betterleaks
            github:github/gh-actions-lock github:jdx/jactionlint
          cache: true
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: mise run deps
      - run: hk check --all --profile ci
        env:
          GITHUB_TOKEN: ${{ github.token }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Test Kotlin code
        run: >-
          ./gradlew
          :migration-core:allTests
          :migration-cli:allTests
          :migration-gradle-plugin:test
          :integration-tests:hyperdrive:jsProductionExecutableCompileSync
          --console=plain

  hyperdrive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: migration
          POSTGRES_PASSWORD: migration # betterleaks:allow -- disposable CI database
          POSTGRES_DB: migration
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U migration -d migration"
          --health-interval 10s --health-timeout 5s --health-retries 12
      mysql:
        image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_ROOT_PASSWORD: migration # betterleaks:allow -- disposable CI database
          MYSQL_DATABASE: migration
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmigration"
          --health-interval 10s --health-timeout 5s --health-retries 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: npm ci --prefix integration-tests/hyperdrive
      - run: ./gradlew :kotlinNpmInstall :integration-tests:hyperdrive:jsProductionExecutableCompileSync --console=plain
      - name: Test PostgreSQL through local Hyperdrive
        run: node integration-tests/hyperdrive/test-worker.mjs postgres
        env:
          WRANGLER_BIN: ./integration-tests/hyperdrive/node_modules/.bin/wrangler
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgres://migration:migration@127.0.0.1:5432/migration # betterleaks:allow -- disposable CI database
      - name: Test MySQL through local Hyperdrive
        run: node integration-tests/hyperdrive/test-worker.mjs mysql
        env:
          WRANGLER_BIN: ./integration-tests/hyperdrive/node_modules/.bin/wrangler
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: mysql://root:migration@127.0.0.1:3306/migration # betterleaks:allow -- disposable CI database
