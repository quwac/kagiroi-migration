name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      version:
        type: string
        default: '0.1.0'

permissions:
  contents: read

env:
  KAGIROI_DIR: ${{ github.workspace }}/.dependencies/kagiroi
  KAGIROI_REF: 81d55e276d91a57135aef0b90e3f07168410fa00

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  artifacts:
    uses: $/.github/workflows/artifacts.yml
    with:
      version: ${{ inputs.version || '0.1.0' }}

  quality:
    runs-on: ubuntu-latest
    env:
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out Kagiroi source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: quwac/kagiroi
          ref: ${{ env.KAGIROI_REF }}
          path: .dependencies/kagiroi
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: '2026.11.4'
          sha256: 0296d9cba9324106d4e0962bb94a2072902f3658813aeb3b09504947bb8ddc2b
          install_args: >-
            --locked java bun node hk rumdl pkl lychee gh zizmor betterleaks
            github:github/gh-actions-lock github:jdx/jactionlint
          cache: true
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: mise run deps
      - run: hk check --all --profile ci
        env:
          GITHUB_TOKEN: ${{ github.token }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out Kagiroi source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: quwac/kagiroi
          ref: ${{ env.KAGIROI_REF }}
          path: .dependencies/kagiroi
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Test Kotlin code
        run: >-
          ./gradlew
          :migration-core:allTests
          :migration-cli:allTests
          :migration-gradle-plugin:test
          :migration-core:publishAllPublicationsToStagingRepository
          :migration-gradle-plugin:publishAllPublicationsToStagingRepository
          --console=plain
      - name: Test published core and plugin consumption
        run: node scripts/test-publications.mjs
      - name: Test native schema exports against Kagiroi source
        run: node integration-tests/native-security-export/test-export.mjs "$KAGIROI_DIR"
      - name: Save failing test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotlin-test-reports
          path: |
            **/build/test-results/
            **/build/reports/tests/
          retention-days: 7
          if-no-files-found: warn

  cli-databases:
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: migration
          POSTGRES_PASSWORD: migration # betterleaks:allow -- disposable CI database
          POSTGRES_DB: migration
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U migration -d migration"
          --health-interval 10s --health-timeout 5s --health-retries 12
      mysql:
        image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_ROOT_PASSWORD: migration # betterleaks:allow -- disposable CI database
          MYSQL_DATABASE: migration
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmigration"
          --health-interval 10s --health-timeout 5s --health-retries 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-linux-x64
          path: build/distributions
      - name: Test packaged CLI with disposable PostgreSQL and MySQL databases
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          MYSQL_PWD: migration # betterleaks:allow -- disposable CI database
          RELEASE_VERSION: ${{ inputs.version || '0.1.0' }}
          KAGIROI_TEST_POSTGRES_URL: postgres://migration:migration@127.0.0.1:5432/packaged # betterleaks:allow -- disposable CI database
          KAGIROI_TEST_MYSQL_URL: mysql://root:migration@127.0.0.1:3306/packaged # betterleaks:allow -- disposable CI database
        run: |
          docker exec "$POSTGRES_CONTAINER" psql -U migration -d postgres -c 'CREATE DATABASE packaged'
          docker exec -e MYSQL_PWD "$MYSQL_CONTAINER" mysql -u root -e 'CREATE DATABASE packaged'
          cd build/distributions
          sha256sum --check "kagiroi-$RELEASE_VERSION-linux-x64.tar.gz.sha256"
          tar -xzf "kagiroi-$RELEASE_VERSION-linux-x64.tar.gz"
          cd ../..
          node scripts/test-cli-dist.mjs "build/distributions/kagiroi-$RELEASE_VERSION-linux-x64/kagiroi" "$RELEASE_VERSION"
